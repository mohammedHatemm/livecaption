spring:
  application:
    name: livecaption
  datasource:
    url: jdbc:postgresql://localhost:5432/livecaption
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:c2VjdXJlLWp3dC1zZWNyZXQta2V5LWZvci1saXZlY2FwdGlvbi1hcHBsaWNhdGlvbi0yNTYtYml0cw==}
  expiration: 604800000

tmdb:
  api-key: ${TMDB_API_KEY:your-tmdb-api-key}
  base-url: https://api.themoviedb.org/3
  image-base-url: https://image.tmdb.org/t/p
  timeout: 5000

# AI Services Configuration
ai:
  # Choose between 'openai' or 'gemini'
  default-provider: ${AI_DEFAULT_PROVIDER:openai}
  
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
    embedding-model: text-embedding-3-small
    chat-model: gpt-4o-mini
    whisper-model: whisper-1
    timeout: 30000
  
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta
    embedding-model: text-embedding-004
    chat-model: gemini-1.5-flash
    timeout: 30000
  
  groq:
    api-key: ${GROQ_API_KEY:}
    base-url: https://api.groq.com/openai/v1
    whisper-model: whisper-large-v3
    timeout: 60000
