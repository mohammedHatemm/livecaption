spring:
  application:
    name: livecaption
  datasource:
    url: jdbc:postgresql://localhost:5432/livecaption
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:c2VjdXJlLWp3dC1zZWNyZXQta2V5LWZvci1saXZlY2FwdGlvbi1hcHBsaWNhdGlvbi0yNTYtYml0cw==}
  expiration: 604800000

tmdb:
  api-key: ${TMDB_API_KEY:your-tmdb-api-key}
  base-url: https://api.themoviedb.org/3
  image-base-url: https://image.tmdb.org/t/p
  timeout: 5000
