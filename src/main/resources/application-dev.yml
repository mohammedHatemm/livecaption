# ===========================================
# Development Profile Configuration
# ===========================================
# This profile enables development-friendly settings
# Activate with: SPRING_PROFILES_ACTIVE=dev

spring:
  datasource:
    # H2 in-memory database for quick development
    url: jdbc:h2:mem:livecaption;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false  # Security: only localhost
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Development JWT (shorter expiration for testing)
jwt:
  secret: ZGV2LW9ubHktc2VjcmV0LWtleS1mb3ItdGVzdGluZy1wdXJwb3Nlcy1vbmx5LTI1Ni1iaXRz
  expiration: 86400000  # 1 day

# TMDB - still required
tmdb:
  api-key: ${TMDB_API_KEY:demo-key}

# Logging
logging:
  level:
    com.elsherif.livecaption: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Swagger enabled
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# Actuator - more endpoints in dev
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans
  endpoint:
    health:
      show-details: always
